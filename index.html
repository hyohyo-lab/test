<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="2026년의 일정과 할 일을 날짜별로 관리하는 미니멀 캘린더 플래너"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="2026 플래너" />
    <meta property="og:title" content="2026 플래너" />
    <meta property="og:description" content="계획이 선명해지는 달력. 2026년의 일정과 할 일을 날짜별로 관리하세요." />
    <meta property="og:url" content="https://blue-2026-planner-seoul.hoyeonfarm.chatgpt.site/" />
    <meta property="og:image" content="https://blue-2026-planner-seoul.hoyeonfarm.chatgpt.site/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1672" />
    <meta property="og:image:height" content="941" />
    <meta property="og:image:alt" content="흰색 배경에 2026 플래너 제목과 달력, 오늘의 할 일이 배치된 이미지" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="2026 플래너" />
    <meta name="twitter:description" content="계획이 선명해지는 달력. 2026년의 일정과 할 일을 날짜별로 관리하세요." />
    <meta name="twitter:image" content="https://blue-2026-planner-seoul.hoyeonfarm.chatgpt.site/og.png" />
    <meta name="twitter:image:alt" content="흰색 배경에 2026 플래너 제목과 달력, 오늘의 할 일이 배치된 이미지" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230071e3'/%3E%3Cpath d='M9 10.5h14v12H9z' fill='white'/%3E%3Cpath d='M9 14h14' stroke='%230071e3' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="./styles.css" />
    <title>2026 플래너</title>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#" aria-label="2026 플래너 홈">
        <span class="brand-mark" aria-hidden="true">26</span>
        <span>2026 플래너</span>
      </a>
      <div class="header-actions">
        <button class="text-button" id="todayButton" type="button">오늘</button>
        <button class="primary-button" id="headerAddButton" type="button">
          <span aria-hidden="true">＋</span> 할 일 추가
        </button>
      </div>
    </header>

    <main class="app-shell">
      <section class="intro" aria-labelledby="pageTitle">
        <p class="eyebrow">YEAR 2026</p>
        <div class="intro-row">
          <h1 id="pageTitle">계획이 선명해지는 달력.</h1>
          <p>하루의 할 일을 기록하고, 한 달의 흐름을 한눈에 살펴보세요.</p>
        </div>
      </section>

      <section class="planner" aria-label="2026년 달력과 할 일">
        <div class="calendar-panel">
          <div class="calendar-toolbar">
            <div>
              <p class="toolbar-year">2026</p>
              <h2 id="monthTitle">9월</h2>
            </div>
            <div class="month-controls" aria-label="월 이동">
              <button id="prevMonth" type="button" aria-label="이전 달">‹</button>
              <button id="nextMonth" type="button" aria-label="다음 달">›</button>
            </div>
          </div>

          <div class="weekday-row" aria-hidden="true">
            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
          </div>
          <div class="calendar-grid" id="calendarGrid" role="grid" aria-labelledby="monthTitle"></div>

          <div class="calendar-legend" aria-label="달력 표시 안내">
            <span><i class="legend-dot blue"></i>할 일 있음</span>
            <span><i class="legend-dot gray"></i>모두 완료</span>
          </div>
        </div>

        <aside class="task-panel" aria-labelledby="selectedDateTitle">
          <div class="task-heading">
            <div>
              <p class="selected-weekday" id="selectedWeekday">화요일</p>
              <h2 id="selectedDateTitle">9월 15일</h2>
            </div>
            <div class="progress-ring" id="progressRing" aria-label="완료율 0퍼센트">
              <span id="progressText">0%</span>
            </div>
          </div>

          <form class="task-form" id="taskForm">
            <label class="sr-only" for="taskInput">새 할 일</label>
            <div class="input-wrap">
              <input
                id="taskInput"
                type="text"
                maxlength="60"
                autocomplete="off"
                placeholder="새로운 할 일"
                required
              />
              <button type="submit" aria-label="할 일 저장">추가</button>
            </div>
            <div class="category-picker" aria-label="카테고리 선택">
              <button class="category-chip is-active" type="button" data-category="업무">업무</button>
              <button class="category-chip" type="button" data-category="개인">개인</button>
              <button class="category-chip" type="button" data-category="기타">기타</button>
            </div>
          </form>

          <div class="task-meta">
            <span id="taskCount">할 일 0개</span>
            <div class="filters" aria-label="할 일 필터">
              <button class="is-active" type="button" data-filter="all">전체</button>
              <button type="button" data-filter="active">진행</button>
              <button type="button" data-filter="done">완료</button>
            </div>
          </div>

          <ul class="task-list" id="taskList" aria-live="polite"></ul>
          <div class="empty-state" id="emptyState" hidden>
            <span aria-hidden="true">✓</span>
            <strong>여유로운 하루예요.</strong>
            <p>위 입력창에서 첫 할 일을 추가해 보세요.</p>
          </div>
        </aside>
      </section>

      <footer class="year-overview" aria-label="2026년 월 바로가기">
        <p>2026 한 해</p>
        <div class="month-jump" id="monthJump"></div>
      </footer>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
